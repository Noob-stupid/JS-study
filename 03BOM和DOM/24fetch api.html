<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        //fetch: 返回一个promise对象
        function fn1(){
            let resPromise = fetch('http://localhost:3000/clazz')
            //使用then处理成功结果
            resPromise.then(res=>res.json()).then(data=>console.log(data))
            .catch(err=>console.assert(err))
        }
    </script>
</body>
</html>
