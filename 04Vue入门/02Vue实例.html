<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <div id="vue实例">
        <h1>{{obj.name}}</h1>
        <h2>{{name}}</h2>
        <button @click="fn1()">点击</button>
        <h2>price初始值</h2>
        <h2>{{bookPrice}}</h2>
        <h2>{{bookName}}</h2>
        <h2>{{tempName}}</h2>
        <button @click="fn2()">点击计算</button>
        <br>
        <button @click="changeX()">改变x</button>
    </div>


    
    <script>
        const{createApp}=Vue
        const myapp = createApp({
            //选项式api
            //数据属性
            data:function(){
                return{
                    name:'Vue',
                    obj:{
                        name:"沧州交通学院",
                        address:"黄骅"
                    },
                    price:20+30,
                    tempName:'',
                    x:0
                }
            },
            //方法属性：定义处理数据或响应事件的函数
            methods:{
                //在方法属性里面，通过this引用data
                fn1(){
                    this.name="Vue入门"
                    // this.obj.name="1"
                },
                fn2(){
                    // this.price=this.bookPrice - 200
                    this.bookName = "Vue编程"
                },
                changeX(){
                    this.x = this.x+5
                }
            },
            //计算属性对数据进行复杂的逻辑运算
            //只读属性，读写属性
            computed:{
                bookPrice(){
                    return this.price*2
                },
                //读写属性
                bookName:{
                    set(v){
                        this.tempName = v
                    },
                    get(){
                        return this.tempName
                    }
                }
            },
            //监听属性：监听data里定义的数据
            //当数据发生改变时，会回调在监听属性里对应的函数
            watch:{
                //监听x的变化，当变化时会调用
                //回调函数(箭头函数)可以接收两个参数:新值，旧值
                x:(newVal,oldVal)=>{
                    console.log(newVal,oldVal)
                }
            },
            //生命周期钩子
            mounted(){
                console.log('mounted挂载完成阶段')
            },
            created(){
                console.log('created创建完成阶段')
            }
        })

        myapp.mount("#vue实例")
    </script>

    

</body>
</html>
